name: Release npm
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  build:
    name: Build npm binary (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'
      - run: cargo build --release --target ${{ matrix.target }}
        if: runner.os == 'macOS'
      - run: cross build --release --target ${{ matrix.target }}
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gwt
  publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            mkdir -p "target/$target/release"
            cp "artifacts/$target/gwt" "target/$target/release/gwt"
            chmod +x "target/$target/release/gwt"
            cargo xtask stage "$target"
          done
      - run: cargo xtask pack-check && cargo xtask sizes
      - run: npm install --prefix /tmp/gwt-npm-smoke --install-links ./packages/gwt ./packages/gwt-* --force && /tmp/gwt-npm-smoke/node_modules/.bin/gwt --version
      - name: Publish npm packages
        run: |
          npm_version_state() {
            local spec="$1"
            local log_file="$2"

            if npm view "$spec" version --json >"$log_file" 2>&1; then
              return 0
            fi
            if grep -Eq 'E404|404 Not Found' "$log_file"; then
              return 1
            fi

            cat "$log_file" >&2
            return 2
          }

          wait_for_npm_version() {
            local spec="$1"
            local log_file
            log_file="$(mktemp)"

            for poll in {1..12}; do
              if npm_version_state "$spec" "$log_file"; then
                rm -f "$log_file"
                return 0
              else
                local state=$?
              fi

              if [ "$state" -eq 2 ]; then
                rm -f "$log_file"
                return 1
              fi

              echo "Waiting for $spec to become visible ($poll/12)..."
              sleep 5
            done

            echo "$spec was published but did not become visible within 60 seconds" >&2
            rm -f "$log_file"
            return 1
          }

          publish_npm_package() {
            local package_dir="$1"
            local name version spec lookup_log publish_log state delay
            name="$(node -p "require('./$package_dir/package.json').name")"
            version="$(node -p "require('./$package_dir/package.json').version")"
            spec="$name@$version"
            lookup_log="$(mktemp)"

            if npm_version_state "$spec" "$lookup_log"; then
              echo "$spec is already published; skipping"
              rm -f "$lookup_log"
              return 0
            else
              state=$?
            fi

            if [ "$state" -eq 2 ]; then
              rm -f "$lookup_log"
              return 1
            fi
            rm -f "$lookup_log"

            for attempt in {1..5}; do
              publish_log="$(mktemp)"
              echo "Publishing $spec (attempt $attempt/5)..."
              if npm publish "./$package_dir" --access public --provenance 2>&1 | tee "$publish_log"; then
                rm -f "$publish_log"
                wait_for_npm_version "$spec"
                return $?
              fi

              lookup_log="$(mktemp)"
              if npm_version_state "$spec" "$lookup_log"; then
                echo "$spec became visible after the publish command failed; treating it as published"
                rm -f "$lookup_log" "$publish_log"
                return 0
              else
                state=$?
              fi
              if [ "$state" -eq 2 ]; then
                rm -f "$lookup_log" "$publish_log"
                return 1
              fi
              rm -f "$lookup_log"

              if ! grep -Eq 'E409|409 Conflict|E429|429 Too Many Requests|E5[0-9]{2}|5[0-9]{2} (Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)|ETIMEDOUT|ECONNRESET|EAI_AGAIN' "$publish_log"; then
                echo "Permanent npm publish error for $spec; not retrying" >&2
                rm -f "$publish_log"
                return 1
              fi
              rm -f "$publish_log"

              if [ "$attempt" -eq 5 ]; then
                echo "npm publish retries exhausted for $spec" >&2
                return 1
              fi

              delay=$((5 * (2 ** (attempt - 1))))
              echo "Transient npm publish error for $spec; retrying in ${delay}s"
              sleep "$delay"
            done
          }

          for package in packages/gwt-* packages/gwt; do
            publish_npm_package "$package"
          done
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
